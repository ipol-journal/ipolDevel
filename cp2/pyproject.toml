[project]
name = "cp2"
version = "0.1.0"
description = "IPOL CP"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "django>=5.2.17,<6.0",
    "gunicorn>=23.0.0",
    "idna>=3.15",
    "requests>=2.34.2",
    "sqlparse>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-env>=1.1.5",
    "responses>=0.25.6",
]

[tool.pytest.ini_options]
minversion = "8.0"
DJANGO_SETTINGS_MODULE = "ControlPanel.test_settings"
pythonpath = ["ControlPanel"]
testpaths = ["ControlPanel/tests"]
addopts = "-v --tb=short"
env = [
    "D:DJANGO_SETTINGS_MODULE=ControlPanel.test_settings",
    "D:IPOL_HOST=localhost",
    "D:IPOL_URL=http://localhost:8000",
]
